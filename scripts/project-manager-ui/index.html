<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SquillPad projects</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">SquillPad</p>
          <h1>Your projects</h1>
          <p class="lede">
            Open a notebook you already use, or create a new one on this host.
          </p>
        </div>
        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="Toggle color theme"
          title="Toggle color theme"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <div
        id="notice"
        class="notice"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <section class="workspace" aria-label="SquillPad project manager">
        <section class="catalog" aria-labelledby="catalog-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">On this host</p>
              <h2 id="catalog-heading">Existing projects</h2>
            </div>
            <button class="quiet-button" id="refresh-projects" type="button">
              Refresh
            </button>
          </div>
          <div
            id="project-list"
            class="project-list"
            aria-live="polite"
            aria-busy="true"
          ></div>
        </section>

        <aside class="create-panel" aria-labelledby="create-heading">
          <div id="create-form-view">
            <p class="eyebrow">New notebook</p>
            <h2 id="create-heading">Create a project</h2>
            <p class="supporting">
              The folder may be absolute, start with <code>~/</code>, or be
              relative to this repository.
            </p>
            <form id="create-form">
              <label>
                Project name
                <input
                  id="project-name"
                  name="name"
                  type="text"
                  maxlength="160"
                  autocomplete="off"
                  required
                />
              </label>
              <label>
                Project directory
                <input
                  id="project-directory"
                  name="directory"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="~/squillpad-notes"
                  required
                />
              </label>
              <label>
                Default host port
                <input
                  id="project-port"
                  name="port"
                  type="number"
                  min="0"
                  max="65535"
                  value="4173"
                  required
                />
                <span class="field-help"
                  >Use 0 to let the operating system choose on every
                  launch.</span
                >
              </label>
              <button class="primary-button" id="create-project" type="submit">
                Create project
              </button>
            </form>
          </div>

          <div id="creation-success" class="success-view" hidden>
            <div class="success-mark" aria-hidden="true">✓</div>
            <p class="eyebrow">Ready</p>
            <h2>Project created</h2>
            <p id="creation-summary" class="supporting"></p>
            <div class="button-row">
              <button class="primary-button" id="open-created" type="button">
                Open project
              </button>
              <button class="quiet-button" id="back-to-projects" type="button">
                Back to projects
              </button>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <template id="project-template">
      <article class="project-card">
        <div class="project-card-top">
          <div>
            <h3 class="project-name"></h3>
            <p class="project-path"></p>
          </div>
          <span class="status-badge"></span>
        </div>
        <div class="project-meta">
          <span class="project-port"></span>
          <span class="legacy-note" hidden>Legacy launcher</span>
        </div>
        <p class="project-problem" hidden></p>
        <button class="primary-button open-project" type="button">
          Open project
        </button>
      </article>
    </template>
  </body>
</html>
